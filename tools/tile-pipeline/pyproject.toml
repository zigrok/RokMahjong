[project]
name = "roktiles"
version = "0.1.0"
description = "Local-first tile face generation pipeline for Rok Mahjong"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pillow>=11.0"]

[project.scripts]
roktiles = "roktiles.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["roktiles"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true
